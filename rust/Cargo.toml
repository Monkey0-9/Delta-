[package]
name = "delta_native"
version = "0.1.0"
edition = "2021"

[lib]
name = "delta_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[features]
default = []
python = ["pyo3"]
live = []

[[bench]]
name = "kernels"
harness = false