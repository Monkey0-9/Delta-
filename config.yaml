# DELTA OS Configuration File
# This file is automatically generated by Config.init_default()

version: "2.0.0"
workspace: "EQUITIES-ALPHA"
execution_mode: "manual"
theme: "monokai_pro"
kill_switch_armed: true

# Paths
config_dir: "C:/Users/Praveen P/.delta"
vault_path: "C:/Users/Praveen P/.delta/vault.bin"
plugin_dir: "C:/Users/Praveen P/.delta/plugins"
audit_log_path: "C:/Users/Praveen P/.delta/audit.log"

# Model configurations
models:
  - name: "local-qwen"
    provider: "ollama"
    endpoint: "http://localhost:11434"
    model: "qwen2.5:7b"
    enabled: true
    params: {}

  - name: "groq"
    provider: "openai-compatible"
    endpoint: "https://api.groq.com/openai/v1"
    model: "llama3-70b-8192"
    api_key_ref: "groq_api_key"
    enabled: true
    params: {}

  - name: "huggingface"
    provider: "huggingface"
    endpoint: "https://api-inference.huggingface.co"
    model: "mistralai/Mistral-7B-Instruct-v0.2"
    api_key_ref: "huggingface_token"
    enabled: true
    params: {}

# Broker configurations
brokers:
  - name: "paper-engine"
    type: "paper"
    environment: "paper"
    enabled: true
    params:
      initial_balance: 100000.0
      spread_bps: 10
      slippage_bps: 5
      fill_probability: 0.95
      commission_per_share: 0.01

  - name: "alpaca-paper"
    type: "alpaca"
    environment: "paper"
    credentials_ref: "alpaca_keys"
    enabled: true
    params: {}

# Data provider configurations
data_providers:
  - name: "yahoo-finance"
    provider: "yahoo"
    enabled: true
    params: {}

  - name: "fred"
    provider: "fred"
    params:
      api_key_ref: "fred_api_key"
    enabled: true

  - name: "google-news"
    provider: "google_news"
    enabled: true
    params: {}

# Risk configuration
risk:
  max_position_pct: 5.0
  max_leverage: 1.5
  daily_drawdown_limit: 2.0
  kelly_fraction: 0.25
  var_confidence: 0.99

# Anti-tilt configuration
anti_tilt_enabled: true
consecutive_loss_limit: 3
cooldown_minutes: 30
