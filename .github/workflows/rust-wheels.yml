name: Rust Wheels

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:

  wheels:

    strategy:
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    runs-on: ${{ matrix.os }}

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install maturin
        run: |
          python -m pip install --upgrade pip
          python -m pip install maturin

      - name: Rust tests
        run: |
          cargo test --workspace

      - name: Build wheels
        run: |
          maturin build --release