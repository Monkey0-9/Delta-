name: delta-security-gates
# B9: blocking SAST/secret/dependency gates on every push + PR.
# Tool versions are pinned; the offline pin-test is tests/test_ci_security_gates.py.
# pins-verified: 2026-10-11 (max-age 180d — the pin-freshness test fails past
# this date; refresh the pins below to reset the clock).
# NOTE (B9 gitleaks decision): no gitleaks/entropy-history job. The shaped
# secret_scan (scripts/release_certify.py) already covers key/PEM/token
# shapes with placeholder/truncation guards, and semgrep --config auto adds
# secrets rules; a gitleaks job would add an external action dep plus
# triage surface for no new coverage. Revisit if secret_scan ever goes red
# on a shape it cannot express.
on: [push, pull_request]
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install semgrep==1.180.0
      - run: semgrep scan --config auto --exclude='*.ipynb' --exclude='artifacts/**' .
  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install bandit==1.8.3
      # Bandit scope = every live Python dir (broker/observability/scripts/
      # trading/finance_model added B9-review: all ship production code).
      # Intentionally unscanned: tui/ (Rust — cargo-audit covers it),
      # tests/ (asserts, not attack surface), artifacts/ (generated output).
      # -ll = medium severity and up only (low/info is triage noise).
      # P0-6 triage (2026-10-11): all -ll findings resolved — B310 scheme
      # enforcement via core.net.urlopen_checked at all 9 call sites (+1
      # audited nosec at the choke point), B314 untrusted-XML via defusedxml
      # + 2MB cap, B324 MD5 via usedforsecurity=False (non-security IDs).
      # This gate is now blocking: do not re-add `|| exit 0`.
      - run: bandit -r core delta_os execution governance risk security research validation data simulation broker observability scripts trading finance_model -ll -f txt
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -c "import sys; sys.path.insert(0,'scripts'); from release_certify import secret_scan; import json; r=secret_scan(); print(json.dumps(r)); raise SystemExit(0 if r['ok'] else 1)"
  cargo-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo install cargo-audit --version 0.22.2 --locked
      # Audit both lockfiles: workspace root (rust/ python extension via
      # rust/Cargo.toml) and tui/Cargo.toml. -f takes the lockfile because
      # cargo-audit has no --manifest-path flag (0.21.0 errored on it).
      - run: cargo audit -f Cargo.lock
      - run: cargo audit -f tui/Cargo.lock
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit==2.9.0
      - run: pip-audit -r requirements.txt --desc
