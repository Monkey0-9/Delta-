name: delta-ci
on: [push, pull_request, workflow_dispatch]
jobs:
  math-invariants:
    # Blocking gate: core mathematical invariants (SVD rank detection, DSR
    # thresholds, CPCV embargoes, EVT coherence) can never silently degrade.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install --retries 5 pytest && pip install --retries 5 -e .
      - run: python -m pytest tests/test_delta_omega.py -q
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install --retries 10 --default-timeout 120 --extra-index-url https://download.pytorch.org/whl/cpu torch
      - run: pip install --retries 5 -e ".[dev]"
      - run: mkdir -p execution/java_gateway/bin && javac -d execution/java_gateway/bin execution/java_gateway/src/delta/execution/*.java
      - run: |
          mkdir -p native/build
          g++ -std=c++17 -shared -fPIC -O2 -I. native/cpp/lob.cpp -o native/build/lob.dll
          gcc -shared -fPIC -O3 -I native/c native/c/delta_fast.c -o native/build/delta_fast.so
          g++ -std=c++17 -shared -fPIC -O3 -I native/cpp native/cpp/fast_book.cpp -o native/build/fast_book.so
          cargo build --release --manifest-path rust/Cargo.toml
      - run: python -m pytest -q
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml
      - run: cargo test --manifest-path tui/Cargo.toml
      - run: cargo bench --manifest-path rust/Cargo.toml -- --test
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin
      - run: maturin build --manifest-path rust/Cargo.toml --features python -i python3.11
