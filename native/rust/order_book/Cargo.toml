[package]
name = "delta_order_book"
version = "0.1.0"
edition = "2021"

[lib]
name = "delta_order_book"
crate-type = ["cdylib", "rlib"]

[dependencies]
# No external dependencies for maximum performance
# We use only std library for zero-allocation hot paths

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.bench]
inherits = "release"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "order_book_bench"
harness = false
