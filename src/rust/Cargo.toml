[package]
name = "delta-rust"
version = "0.1.0"
edition = "2021"

[lib]
name = "delta_rust"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.20", features = ["extension-module"] }
crossbeam = "0.8"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
parking_lot = "0.12"
atomic = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"